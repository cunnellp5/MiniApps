<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philip Cunnell - Software Engineer</title>
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            line-height: 1.75;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            gap: 40px;
        }

        .main-content {
            flex: 1;
            max-width: 720px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.03), 0 2px 4px -2px rgb(0 0 0 / 0.03);
            border: 1px solid #e2e8f0;
        }

        html {
            scroll-behavior: smooth;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
            }

            .container {
                flex-direction: column;
                gap: 24px;
            }

            .card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="main-content">
            <div class="card">
                under construction
            </div>
        </div>
    </div>
</body>
</html>
